{{- if .Values.enabled }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "secrets[].name is required" .name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    name: sakura-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name | quote }}
    {{- with .labels }}
    template:
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
    # 既存 Secret を引き継ぎ、削除時にも値を残す。
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- range $key, $remote := required "secrets[].keys must not be empty" .keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ required "remote secret name must not be empty" $remote | quote }}
    {{- end }}
{{- end }}
{{- end }}
