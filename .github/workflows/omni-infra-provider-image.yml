name: Omni Sakura infra provider image

on:
  push:
    branches: [main]
    tags: ["omni-infra-provider-sakura-v*"]
    paths:
      - "omni/infra-provider-sakura/**"
      - ".github/workflows/omni-infra-provider-image.yml"
  pull_request:
    paths:
      - "omni/infra-provider-sakura/**"
      - ".github/workflows/omni-infra-provider-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omni/infra-provider-sakura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: omni/infra-provider-sakura/go.mod
          cache-dependency-path: omni/infra-provider-sakura/go.sum
      - run: go test ./...

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/omni-infra-provider-sakura
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: omni/infra-provider-sakura
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
