name: GitOps validation
on:
  pull_request:
    paths:
      - 'manifest/**'
      - 'charts/**'
      - 'scripts/**'
      - 'aqua.yaml'
      - '.github/workflows/gitops.yml'
  push:
    branches: [main]
    paths:
      - 'manifest/**'
      - 'charts/**'
      - 'scripts/**'
      - 'aqua.yaml'
      - '.github/workflows/gitops.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v5
      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate-gitops.py --environment ${{ matrix.environment }}
      - name: Bootstrap/recovery tests
        run: |
          if [ -d scripts/tests ]; then
            PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/tests -v
          fi
