version: 3

env:
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/talosconfig'
  KUBECONFIG: '{{.ROOT_DIR}}/.kube/config'

vars:
  # renovate: datasource=github-releases depName=siderolabs/talos
  TALOS_VERSION: v1.13.9
  # talos/schematic.yaml (Longhorn 用 system extensions 入り)
  TALOS_SCHEMATIC: 613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
  TF_INPUT_JSON: '{{.ROOT_DIR}}/talos/build/talos-input.json'
  # Gateway API の CRD。ExternalAuth フィルタ (GEP-1494) を使うので
  # standard ではなく experimental チャネルを入れる必要がある。
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  GATEWAY_API_VERSION: v1.6.1
  # Let's Encrypt の失効通知などが飛ぶ宛先。.envrc (direnv) の ACME_EMAIL を読む。
  ACME_EMAIL: '{{.ACME_EMAIL | default "TODO-set-me@ictsc.net"}}'

tasks:
  # 共通
  check-binary:
    desc: 指定されたバイナリがインストールされているか確認
    internal: true
    silent: true
    cmds:
      - |
        if ! (type {{.BINARY}} >/dev/null 2>&1); then
          echo "下記公式ドキュメントを参考に{{if .ALT_NAME}}{{.ALT_NAME}}{{else}}{{.BINARY}}{{end}}をインストールした後、もう一度実行してください"
          echo "{{.INSTALL_DOC}}"
          exit 1
        fi

  # 初期化
  init:
    desc: ワークスペースを初期化
    cmds:
      - task: init-tools
      - task: init-env
      - task: init-terraform
      - chmod +x talos/scripts/*.sh

  init-tools:
    desc: aqua で CLI を導入
    internal: true
    deps:
      - task: check-binary
        vars:
          BINARY: aqua
          INSTALL_DOC: https://aquaproj.github.io/docs/install
    cmds:
      - aqua install

  init-env:
    desc: 環境変数を初期化
    internal: true
    deps:
      - task: check-binary
        vars:
          BINARY: direnv
          INSTALL_DOC: https://github.com/direnv/direnv/blob/master/docs/installation.md
    cmds:
      - task: init-env-file
      - direnv allow

  init-env-file:
    desc: .envrc.tmpl から .envrc を作成
    internal: true
    silent: true
    deps:
      - task: check-binary
        vars:
          BINARY: envsubst
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    vars:
      DEFAULT_ZONE: tk1b
      DEFAULT_BUCKET: ictsc-void-k8s-dev
      DEFAULT_ACME_EMAIL: TODO-set-me@ictsc.net
    status:
      - test -f .envrc
    cmds:
      - |
        echo "さくらクラウドのアクセストークンを入力してください"
        read SAKURACLOUD_ACCESS_TOKEN
        echo "さくらクラウドのアクセスシークレットを入力してください"
        read SAKURACLOUD_ACCESS_TOKEN_SECRET
        echo "tfstateを保存するバケットを選択してください (default: {{.DEFAULT_BUCKET}})"
        read TF_STATE_BUCKET
        TF_STATE_BUCKET=${TF_STATE_BUCKET:-{{.DEFAULT_BUCKET}}}
        echo "さくらのオブジェクトストレージのアクセスキーを入力してください"
        read AWS_ACCESS_KEY_ID
        echo "さくらのオブジェクトストレージのシークレットキーを入力してください"
        read AWS_SECRET_ACCESS_KEY
        echo "GitHub App (または OAuth App) の Client ID を入力してください"
        read GITHUB_CLIENT_ID
        echo "同じアプリの Client secret を入力してください"
        read GITHUB_CLIENT_SECRET
        echo "Let's Encrypt の通知先メールアドレスを入力してください (default: {{.DEFAULT_ACME_EMAIL}})"
        read ACME_EMAIL
        ACME_EMAIL=${ACME_EMAIL:-{{.DEFAULT_ACME_EMAIL}}}
        SAKURACLOUD_ZONE={{.DEFAULT_ZONE}}
        export SAKURACLOUD_ACCESS_TOKEN SAKURACLOUD_ACCESS_TOKEN_SECRET SAKURACLOUD_ZONE \
          TF_STATE_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
          GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET ACME_EMAIL
        umask 077
        envsubst < .envrc.tmpl > .envrc
        echo ".envrcを作成しました"

  reset-env:
    desc: 環境変数を再設定
    cmds:
      - rm -f .envrc
      - task: init-env

  init-terraform:
    desc: Terraformの初期化
    dir: terraform
    deps:
      - task: check-binary
        vars:
          BINARY: terraform
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      - terraform init

  # ワークスペース
  show-ws:
    desc: ワークスペースを表示
    dir: terraform
    cmds:
      - terraform workspace show

  select-dev:
    desc: ワークスペースをdevに切り替え
    cmds:
      - cd terraform && terraform workspace select -or-create dev

  select-prod:
    desc: ワークスペースをprodに切り替え
    cmds:
      - cd terraform && terraform workspace select -or-create prod

  # Terraform / Talos
  fetch-talos-image:
    desc: Talos の nocloud イメージを取得
    cmds:
      - TALOS_VERSION={{.TALOS_VERSION}} TALOS_SCHEMATIC={{.TALOS_SCHEMATIC}} ./talos/scripts/fetch-image.sh

  apply-network:
    desc: グローバルIPを確定させるためネットワークだけ先に作る
    internal: true
    dir: terraform
    cmds:
      - terraform apply -auto-approve -target=sakura_internet.k8s_external -target=sakura_vswitch.k8s_internal

  talos-config:
    desc: Terraformの出力から Talos の machine config と cidata ISO を生成
    deps:
      - task: check-binary
        vars:
          BINARY: talosctl
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
      - task: check-binary
        vars:
          BINARY: jq
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      # 既存クラスタに別の PKI を生成・適用しない。
      - |
        set -eu
        if [ ! -f talos/secrets.yaml ]; then
          if (cd terraform && terraform state list 2>/dev/null) | grep -q '^sakura_server\.'; then
            echo "ERROR: talos/secrets.yaml がありませんが、tfstate には既にサーバが存在します" >&2
            echo "" >&2
            echo "  このまま進むと別クラスタの PKI を新規生成してしまいます。" >&2
            echo "  既存クラスタを構築したマシンから secrets.yaml を持ってきてください:" >&2
            echo "" >&2
            echo "    scp <構築したマシン>:<リポジトリ>/talos/secrets.yaml talos/secrets.yaml" >&2
            echo "" >&2
            echo "  (本当にゼロから作り直すなら talos/secrets.yaml.new などを作って" >&2
            echo "   task destroy してから、この判定を通してください)" >&2
            exit 1
          fi
        fi
      - mkdir -p talos/build
      - cd terraform && terraform output -json talos_input > {{.TF_INPUT_JSON}}
      - ./talos/scripts/gen-config.sh {{.TF_INPUT_JSON}}
      # 生成した PKI が既存クラスタのものか接続して確認する。
      - |
        set -eu
        if ! (cd terraform && terraform state list 2>/dev/null) | grep -q '^sakura_server\.'; then
          exit 0   # まだクラスタが無い (初回構築) ので検証しようがない
        fi
        cd terraform
        EP=$(terraform output -json control_plane_ips | jq -r '.[0]')
        NODE=$(terraform output -json talos_input \
          | jq -r '[.nodes[] | select(.role=="controlplane") | .internal_ip][0]')
        cd ..
        if TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh \
             --talosconfig talos/talosconfig -n "${NODE}" version --short >/dev/null 2>&1; then
          echo "==> 生成した設定で control plane に到達できました"
          exit 0
        fi
        echo "ERROR: 生成した talosconfig で control plane に到達できません" >&2
        echo "" >&2
        echo "  talos/secrets.yaml が、今動いているクラスタのものと違う可能性が高いです。" >&2
        echo "  このまま apply すると CD-ROM が別 CA の machine config で上書きされ、" >&2
        echo "  ノードが再ブートストラップした時点でクラスタに参加できなくなります。" >&2
        echo "" >&2
        echo "  構築したマシンから secrets.yaml を持ってきて、やり直してください:" >&2
        echo "" >&2
        echo "    scp <構築したマシン>:<リポジトリ>/talos/secrets.yaml talos/secrets.yaml" >&2
        echo "    rm -rf talos/build talos/talosconfig" >&2
        echo "" >&2
        echo "  (クラスタが停止中／ネットワーク不通でもこのエラーになります。" >&2
        echo "   その場合は疎通を回復してから再実行してください)" >&2
        exit 1

  lint-terraform:
    desc: TerraformのLintを実行
    internal: true
    dir: terraform
    deps:
      - task: check-binary
        vars:
          BINARY: tflint
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      - tflint

  format-terraform:
    desc: Terraformのフォーマットを実行
    dir: terraform
    cmds:
      - terraform fmt

  apply-terraform:
    desc: Terraformを実行
    internal: true
    dir: terraform
    cmds:
      - terraform apply -auto-approve

  stage-worker-config:
    desc: worker の Talos machine config を次回再起動時の適用としてステージする
    deps:
      - task: talos-config
    cmds:
      - |
        set -eu
        cd terraform
        INPUT=$(terraform output -json talos_input)
        EP=$(echo "${INPUT}" | jq -r '[.nodes[] | select(.role=="controlplane") | .external_ip][0]')
        CLUSTER=$(echo "${INPUT}" | jq -r '.cluster_name')
        cd ..

        echo "${INPUT}" | jq -r '.nodes[] | select(.role=="worker") | "\(.hostname) \(.internal_ip)"' \
          | while read -r HOST INTERNAL; do
              echo "==> ${HOST} の設定をステージ"
              TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh \
                -n "${INTERNAL}" apply-config --mode=staged \
                -f "talos/build/${CLUSTER}/config/${HOST}.yaml"
            done

        echo "==> ステージ完了。task upgrade-talos TO={{.TALOS_VERSION}} で順次再起動してください"

  apply:
    desc: インフラを構築 (イメージ取得 -> ネットワーク -> Talos設定生成 -> 全体apply)
    deps:
      - show-ws
      - format-terraform
      - lint-terraform
    cmds:
      - task: fetch-talos-image
      - task: apply-network
      - task: talos-config
      - task: apply-terraform
      - task: prune-nodes

  prune-nodes:
    desc: Terraform 上に存在しないのに残っている Node オブジェクトを削除
    cmds:
      # 台数削減時の drain は vars.tf を変える前に行う。
      - |
        set -eu
        # 初回構築ではまだクラスタが無い
        if ! kubectl get nodes >/dev/null 2>&1; then
          echo "==> クラスタに到達できないため Node の掃除をスキップ"
          exit 0
        fi

        tmp=$(mktemp -d)
        trap 'rm -rf "${tmp}"' EXIT
        (cd terraform && terraform output -json talos_input) \
          | jq -r '.nodes[].hostname' | sort > "${tmp}/expected"
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | sort > "${tmp}/actual"

        stale=$(comm -13 "${tmp}/expected" "${tmp}/actual")
        if [ -z "${stale}" ]; then
          echo "==> 余分な Node はありません"
          exit 0
        fi

        for node in ${stale}; do
          # control plane を消すと etcd にメンバーの残骸が残る。ここでは触らない。
          if kubectl get node "${node}" \
            -o jsonpath='{.metadata.labels.node-role\.kubernetes\.io/control-plane}' \
            | grep -q .; then
            echo "==> ${node} は control plane のためスキップします" >&2
            echo "    etcd のメンバー削除が必要です:" >&2
            echo "      ./talos/scripts/talosctl-via-bastion.sh -n <残っている cp の内部IP> etcd remove-member ${node}" >&2
            echo "      kubectl delete node ${node}" >&2
            continue
          fi
          echo "==> Node ${node} を削除"
          kubectl delete node "${node}"
        done

  destroy:
    desc: 全てのリソースを削除
    dir: terraform
    cmds:
      - terraform destroy

  # クラスタのブートストラップ
  talos-bootstrap:
    desc: etcd を初期化してクラスタを立ち上げる (初回のみ)
    deps:
      - task: check-binary
        vars:
          BINARY: talosctl
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      - |
        CP1=$(cd terraform && terraform output -json control_plane_ips | jq -r '.[0]')
        echo "==> ${CP1} で talosctl bootstrap を実行 (Talos の起動を待つので数分かかります)"
        until ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" version --short >/dev/null 2>&1; do sleep 10; done
        ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" bootstrap || true

        # CNI 投入前なので、ここでは talosctl health を実行しない。
        echo "==> etcd が Running になるのを待つ"
        until ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" service etcd 2>/dev/null | grep -qE '^STATE +Running'; do sleep 10; done
        echo "==> etcd OK"

  kubeconfig:
    desc: kubeconfigを取得
    cmds:
      - mkdir -p .kube
      - |
        CP1=$(cd terraform && terraform output -json control_plane_ips | jq -r '.[0]')
        ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" kubeconfig ./.kube/config --force
      - kubectl config rename-context "$(kubectl config current-context)" "$(cd terraform && terraform workspace show)" || true

  hosts:
    desc: /etc/hosts に貼る行を表示 (DNS を使わずに動作確認したいとき用)
    silent: true
    dir: terraform
    cmds:
      - terraform output -raw hosts_entries
      - echo

  render-env-values:
    desc: terraform output から env 固有の値 (VIP・ドメイン) をマニフェストに反映
    cmds:
      - |
        set -eu
        cd terraform
        ENV=$(terraform workspace show)
        INGRESS_VIP=$(terraform output -raw ingress_vip)
        DOMAIN=$(terraform output -raw domain)
        CLUSTER=$(terraform output -json talos_input | jq -r '.cluster_name')
        POD_SUBNET=$(terraform output -json talos_input | jq -r '.pod_subnet')
        NFS_IP=$(terraform output -raw nfs_ip)
        cd ..
        ./manifest/scripts/render-env.sh \
          "${ENV}" "${CLUSTER}" "${DOMAIN}" "${INGRESS_VIP}" '{{.ACME_EMAIL}}' "${POD_SUBNET}" "${NFS_IP}"
  install-gateway-api-crds:
    desc: Gateway API の CRD (experimental チャネル) を導入
    cmds:
      # ExternalAuth フィルタには experimental CRD が必要。
      - >-
        kubectl apply --server-side
        -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/experimental-install.yaml

  bootstrap-cluster:
    desc: CNI (Cilium) と Argo CD を入れて GitOps を開始する
    deps:
      - task: check-binary
        vars:
          BINARY: helm
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    vars:
      ENV: { sh: 'cd terraform && terraform workspace show' }
    cmds:
      # Gateway API CRD は Cilium の起動前に入れる。
      - task: install-gateway-api-crds
      # Cilium と Argo CD だけ先に Helm で入れ、以降は Argo CD に引き継ぐ。
      - helm repo add cilium https://helm.cilium.io/
      - helm repo add argo https://argoproj.github.io/argo-helm
      - helm repo update cilium argo
      - >-
        # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
        helm upgrade --install cilium cilium/cilium --version=1.20.1
        --namespace kube-system
        -f manifest/base/infra/cilium/values.yaml
        -f manifest/envs/{{.ENV}}/values/cilium.yaml
        --wait --timeout 10m
      - kubectl -n kube-system rollout status deploy/coredns --timeout=10m
      # 残りの依存順序は Argo CD の sync-wave に任せる。
      - >-
        # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
        helm upgrade --install argocd argo/argo-cd --version=10.2.3
        --namespace argocd --create-namespace
        -f manifest/base/infra/argocd/values.yaml
        -f manifest/envs/{{.ENV}}/values/argocd.yaml
        --wait --timeout 10m

  alert-secrets:
    desc: Alertmanager の通知先 (Discord webhook) を Secret にする
    cmds:
      - |
        set -eu
        if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
          echo "DISCORD_WEBHOOK_URL が設定されていません" >&2
          echo ".envrc.tmpl を参考に .envrc へ追記して direnv allow するか、task reset-env で作り直してください" >&2
          exit 1
        fi
        kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl -n monitoring create secret generic alertmanager-discord \
          --from-literal=webhook-url="${DISCORD_WEBHOOK_URL}" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        echo "==> monitoring/alertmanager-discord を作成しました"

  object-storage-secrets:
    desc: Terraform が発行した Loki / Tempo 用 Object Storage 認証情報を Secret にする
    deps:
      - task: check-binary
        vars:
          BINARY: jq
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
      - task: check-binary
        vars:
          BINARY: kubectl
          INSTALL_DOC: https://kubernetes.io/docs/tasks/tools/
    cmds:
      - |
        set -eu

        env=$(cd terraform && terraform workspace show)
        if [ "${env}" != "dev" ]; then
          echo "Object Storage 認証情報は dev workspace だけに作成されています (現在: ${env})" >&2
          echo "task select-dev を実行してからやり直してください" >&2
          exit 1
        fi

        tmp=$(mktemp -d)
        trap 'rm -rf "${tmp}"' EXIT
        chmod 700 "${tmp}"

        terraform -chdir=terraform output -json loki_object_storage_credentials \
          | jq -er '"AWS_ACCESS_KEY_ID=\(.access_key)\nAWS_SECRET_ACCESS_KEY=\(.secret_key)"' \
          > "${tmp}/loki.env"
        terraform -chdir=terraform output -json tempo_object_storage_credentials \
          | jq -er '"AWS_ACCESS_KEY_ID=\(.access_key)\nAWS_SECRET_ACCESS_KEY=\(.secret_key)"' \
          > "${tmp}/tempo.env"
        chmod 600 "${tmp}/loki.env" "${tmp}/tempo.env"

        kubectl create namespace monitoring \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl -n monitoring create secret generic loki-object-storage \
          --from-env-file="${tmp}/loki.env" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl -n monitoring create secret generic tempo-object-storage \
          --from-env-file="${tmp}/tempo.env" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null

        echo "==> monitoring/loki-object-storage を作成しました"
        echo "==> monitoring/tempo-object-storage を作成しました"

  argocd-repo-key:
    desc: Argo CD が private GitHub リポジトリを読むための deploy key を登録
    deps:
      - task: check-binary
        vars:
          BINARY: gh
          INSTALL_DOC: https://cli.github.com/
    status:
      # Secret があれば作成済みとみなす
      - kubectl -n argocd get secret repo-{{.REPO_NAME}} >/dev/null 2>&1
    vars:
      DEFAULT_REPO: { sh: 'git remote get-url origin | sed "s|.*[:/]\([^/]*/[^/]*\)\.git|\1|"' }
      REPO: '{{.REPO | default .DEFAULT_REPO}}'
      REPO_NAME: '{{base .REPO}}'
      REPO_URL: 'git@github.com:{{.REPO}}.git'
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "${tmp}"' EXIT
        chmod 700 "${tmp}"
        ssh-keygen -t ed25519 -N "" -C "argocd@{{.REPO_NAME}}" -f "${tmp}/key" >/dev/null

        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl -n argocd create secret generic repo-{{.REPO_NAME}} \
          --from-literal=type=git \
          --from-literal=url="{{.REPO_URL}}" \
          --from-file=sshPrivateKey="${tmp}/key" \
          --dry-run=client -o yaml \
          | kubectl label -f - --local -o yaml argocd.argoproj.io/secret-type=repository \
          | kubectl apply -f - >/dev/null
        echo "==> Secret argocd/repo-{{.REPO_NAME}} を作成しました"

        title="argocd ($(cd terraform && terraform workspace show))"
        gh repo deploy-key add "${tmp}/key.pub" --repo "{{.REPO}}" --title "${title}"
        echo "==> deploy key を {{.REPO}} に登録しました (read-only)"

  argocd-repo-keys:
    desc: Argo CD が参照する private GitHub リポジトリを登録
    internal: true
    cmds:
      - task: argocd-repo-key

  auth-secrets:
    desc: Dex / oauth2-proxy / Argo CD の OIDC 用 Secret を作る
    status:
      - kubectl -n dex get secret dex-secrets >/dev/null 2>&1
    cmds:
      - |
        set -eu
        # 値は .envrc (direnv) から取る。聞き直さない。
        if [ -z "${GITHUB_CLIENT_ID:-}" ] || [ -z "${GITHUB_CLIENT_SECRET:-}" ]; then
          echo "GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET が設定されていません" >&2
          echo ".envrc.tmpl を参考に .envrc へ追記して direnv allow するか、task reset-env で作り直してください" >&2
          exit 1
        fi

        rand() { openssl rand -base64 32 | tr -- '+/' '-_'; }
        O2P_SECRET=$(rand)
        ARGOCD_SECRET=$(rand)
        GRAFANA_SECRET=$(rand)

        for ns in dex oauth2-proxy argocd monitoring; do
          kubectl create namespace "${ns}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        done

        kubectl -n dex create secret generic dex-secrets \
          --from-literal=github-client-id="${GITHUB_CLIENT_ID}" \
          --from-literal=github-client-secret="${GITHUB_CLIENT_SECRET}" \
          --from-literal=oauth2-proxy-client-secret="${O2P_SECRET}" \
          --from-literal=argocd-client-secret="${ARGOCD_SECRET}" \
          --from-literal=grafana-client-secret="${GRAFANA_SECRET}" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null

        kubectl -n oauth2-proxy create secret generic oidc \
          --from-literal=client-id=oauth2-proxy \
          --from-literal=client-secret="${O2P_SECRET}" \
          --from-literal=cookie-secret="$(rand)" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null

        kubectl -n argocd create secret generic argocd-oidc \
          --from-literal=clientSecret="${ARGOCD_SECRET}" \
          --dry-run=client -o yaml \
          | kubectl label -f - --local -o yaml app.kubernetes.io/part-of=argocd \
          | kubectl apply -f - >/dev/null

        kubectl -n monitoring create secret generic grafana-oidc \
          --from-literal=clientSecret="${GRAFANA_SECRET}" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null

        echo "==> dex-secrets / oidc / argocd-oidc / grafana-oidc を作成しました"

  start-gitops:
    desc: app-of-apps のルートを適用して Argo CD に引き継ぐ
    deps:
      - task: argocd-repo-keys
      - task: auth-secrets
    vars:
      ENV: { sh: 'cd terraform && terraform workspace show' }
    cmds:
      - kubectl apply -f manifest/root-{{.ENV}}.yaml

  health:
    desc: クラスタの健全性を確認 (CNI 投入後に実行すること)
    deps:
      - task: check-binary
        vars:
          BINARY: talosctl
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      # endpoint は外部 IP、検査対象ノードは etcd/kubelet と同じ内部 IP を渡す。
      - |
        cd terraform
        EP=$(terraform output -json control_plane_ips | jq -r '.[0]')
        CP=$(terraform output -json talos_input \
          | jq -r '[.nodes[] | select(.role == "controlplane") | .internal_ip] | join(",")')
        WK=$(terraform output -json talos_input \
          | jq -r '[.nodes[] | select(.role == "worker") | .internal_ip] | join(",")')
        cd ..
        TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh -n "${CP%%,*}" health \
          --control-plane-nodes "${CP}" \
          --worker-nodes "${WK}" \
          --wait-timeout 10m

  argocd-password:
    desc: Argo CD の初期 admin パスワードを表示
    cmds:
      - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d && echo

  # アップグレード
  # terraform/vars.tf の talos_version は新規ノード用。稼働中の更新は upgrade-talos を使う。

  upgrade-talos:
    desc: 'Talos OS を1台ずつ更新 (例: task upgrade-talos TO=v1.13.9)'
    deps:
      - task: check-binary
        vars:
          BINARY: talosctl
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      - |
        set -eu
        TO="{{.TO}}"
        if [ -z "${TO}" ]; then
          echo "ERROR: TO を指定してください (例: task upgrade-talos TO=v1.13.9)" >&2
          exit 1
        fi

        cd terraform
        INPUT=$(terraform output -json talos_input)
        cd ..

        # control plane を先に、その後 worker。どちらも1台ずつ。
        # cp を並列で落とすと etcd の quorum を失う。
        CP_EXT=$(echo "${INPUT}" | jq -r '[.nodes[] | select(.role=="controlplane") | .external_ip] | join(" ")')
        ORDER=$(echo "${INPUT}" | jq -r '
          ([.nodes[] | select(.role=="controlplane")] + [.nodes[] | select(.role=="worker")])
          | .[] | "\(.hostname) \(.internal_ip) \(.external_ip)"')

        echo "==> ${TO} へ更新します"
        echo "${ORDER}" | awk '{print "    " $1 " (" $2 ")"}'
        echo

        echo "${ORDER}" | while read -r HOST INTERNAL EXTERNAL; do
          # 対象ノード自身を endpoint にすると再起動で経路が切れる。別の cp を使う。
          EP=""
          for c in ${CP_EXT}; do
            [ "${c}" = "${EXTERNAL}" ] && continue
            EP="${c}"; break
          done

          echo "==> ${HOST} を更新 (endpoint: ${EP})"
          # --drain は既定 true なので cordon + evict は talosctl がやる
          TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh -n "${INTERNAL}" upgrade \
            -i "factory.talos.dev/installer/{{.TALOS_SCHEMATIC}}:${TO}"

          echo "==> ${HOST} が Ready になるのを待つ"
          until [ "$(kubectl get node "${HOST}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" = "True" ]; do
            sleep 10
          done
          # 正常時は Talos が uncordon するが、取りこぼしても困るので念のため
          kubectl uncordon "${HOST}" >/dev/null 2>&1 || true
          echo "==> ${HOST} OK"
          echo
        done

        echo "==> 全ノードの更新が完了しました"
        echo "    aqua.yaml の siderolabs/talos と terraform/vars.tf の talos_version も"
        echo "    ${TO} に揃えておくこと (新しいノードを作るときの元になります)"

  upgrade-k8s:
    desc: 'Kubernetes を更新 (例: task upgrade-k8s TO=1.36.4)'
    deps:
      - task: check-binary
        vars:
          BINARY: talosctl
          INSTALL_DOC: "aqua install で導入されます (aqua.yaml を参照)"
    cmds:
      # talosctl upgrade-k8s が全ノードを順番に更新する。意図しない版を避けるため TO は必須。
      - |
        set -eu
        TO="{{.TO}}"
        if [ -z "${TO}" ]; then
          echo "ERROR: TO を指定してください (例: task upgrade-k8s TO=1.36.4)" >&2
          echo "       マイナーは1つずつ上げること (1.36 -> 1.37 -> 1.38)。" >&2
          echo "       パッチは飛ばしてよい (1.36.1 -> 1.36.4)。" >&2
          exit 1
        fi

        cd terraform
        EP=$(terraform output -json control_plane_ips | jq -r '.[0]')
        CP1=$(terraform output -json talos_input \
          | jq -r '[.nodes[] | select(.role=="controlplane") | .internal_ip][0]')
        cd ..

        echo "==> 計画 (dry-run)"
        TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" upgrade-k8s --to "${TO}" --dry-run
        echo
        echo "==> 実行"
        TALOS_EP="${EP}" ./talos/scripts/talosctl-via-bastion.sh -n "${CP1}" upgrade-k8s --to "${TO}"
        echo
        echo "==> 完了。terraform/vars.tf の kubernetes_version と"
        echo "    aqua.yaml の kubectl も ${TO} に揃えておくこと"

  up:
    desc: ゼロからクラスタが立ち上がるまで一気にやる
    cmds:
      - task: apply
      - task: talos-bootstrap
      - task: kubeconfig
      - task: render-env-values
      - task: bootstrap-cluster
      - task: start-gitops
      - task: health
