# 既存値のインポートと認証 Secret の投入後に有効化する。
enabled: false
secrets:
  - name: grafana-oidc
    keys:
      clientSecret: oidc-grafana-client-secret
  - name: alertmanager-discord
    keys:
      webhook-url: alertmanager-discord-webhook-url
  - name: loki-object-storage
    keys:
      AWS_ACCESS_KEY_ID: loki-object-storage-access-key
      AWS_SECRET_ACCESS_KEY: loki-object-storage-secret-key
  - name: tempo-object-storage
    keys:
      AWS_ACCESS_KEY_ID: tempo-object-storage-access-key
      AWS_SECRET_ACCESS_KEY: tempo-object-storage-secret-key
