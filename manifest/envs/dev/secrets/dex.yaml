# 既存値のインポートと認証 Secret の投入後に有効化する。
enabled: false
secrets:
  - name: dex-secrets
    keys:
      github-client-id: dex-github-client-id
      github-client-secret: dex-github-client-secret
      oauth2-proxy-client-secret: oidc-oauth2-proxy-client-secret
      argocd-client-secret: oidc-argocd-client-secret
      grafana-client-secret: oidc-grafana-client-secret
