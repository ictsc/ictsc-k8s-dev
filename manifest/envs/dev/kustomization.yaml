resources:
  - ../../base
  - ./resources/cilium-lb-ip-pool.yaml
  - ./resources/cilium-l2-announcement.yaml
  - ./resources/gateway.yaml
  - ./resources/cluster-issuer.yaml
  - ./resources/storageclass-nfs.yaml
  - ./resources/alertmanager-discord.yaml
  - ./resources/rbac-oidc.yaml
  - ./resources/httproutes.yaml

patches:
  - target: {kind: Application}
    patch: |-
      - op: add
        path: /spec/info
        value:
          - name: Environment
            value: dev
  - target: {kind: Application, name: cilium}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/cilium.yaml
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/kube-prometheus-stack.yaml
  - target: {kind: Application, name: loki}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/loki.yaml
  - target: {kind: Application, name: argocd}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/argocd.yaml
  - target: {kind: Application, name: dex}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/dex.yaml
  - target: {kind: Application, name: oauth2-proxy}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/oauth2-proxy.yaml
  - target: {kind: Application, name: regalia-postgres}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/regalia-postgres.yaml
