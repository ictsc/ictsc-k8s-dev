resources:
  - ../../base
  - ../../base/infra/plugin-barman-cloud
  - ../../base/infra/external-secrets
  - ./resources/infra-secrets.yaml
  - ./resources/regalia-auth.yaml
  - ./resources/regalia-openapi-database.yaml
  - ./resources/postgres-backup-alerts.yaml
  - ./resources/cilium-lb-ip-pool.yaml
  - ./resources/cilium-l2-announcement.yaml
  - ./resources/gateway.yaml
  - ./resources/regalia-pr-preview.yaml
  - ./resources/regalia-preview-secretstore.yaml
  - ./resources/regalia-preview-controller.yaml
  - ../../base/apps/regalia/pr-preview/activation
  - ./resources/cluster-issuer.yaml
  - ./resources/storageclass-nfs.yaml
  - ./resources/storageclass-longhorn-single-replica.yaml
  - ./resources/alertmanager-discord.yaml
  - ./resources/rbac-oidc.yaml
  - ./resources/httproutes.yaml
  - ./resources/longhorn.yaml
  - ./resources/tempo.yaml
  - ./resources/opentelemetry-collector.yaml
  - ./resources/opentelemetry-alerts.yaml

patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: external
        namespace: gateway
      spec:
        allowedListeners:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                app.kubernetes.io/part-of: regalia-pr-preview
                gateway-access: "true"
  # Preview branch is pinned explicitly; do not follow main images.
  - patch: |-
      $patch: delete
      apiVersion: argocd-image-updater.argoproj.io/v1alpha1
      kind: ImageUpdater
      metadata:
        name: regalia
        namespace: argocd
  - target: {kind: Application, name: regalia}
    patch: |-
      - op: remove
        path: /spec/source
      - op: add
        path: /spec/sources
        value:
          - repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
            targetRevision: refs/heads/main
            path: manifest/base/apps/regalia/workload/overlays/openapi-dev
            ref: values
          - repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
            targetRevision: refs/heads/main
            path: charts/sakura-secrets
            helm:
              releaseName: regalia-secrets
              valueFiles:
                - $values/manifest/base/apps/regalia/secrets/dev.yaml
  - target: {kind: Application}
    patch: |-
      - op: add
        path: /spec/info
        value:
          - name: Environment
            value: dev
  - target: {kind: Application, name: cilium}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/cilium.yaml
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/kube-prometheus-stack.yaml
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/kube-prometheus-stack-observability.yaml
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/kube-prometheus-stack-storage.yaml
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: ""
            kind: PersistentVolumeClaim
            jsonPointers:
              - /spec/volumeName
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: RespectIgnoreDifferences=true
  - target: {kind: Application, name: loki}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/loki.yaml
  - target: {kind: Application, name: argocd}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/argocd.yaml
  - target: {kind: Application, name: dex}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/dex.yaml
  - target: {kind: Application, name: oauth2-proxy}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/oauth2-proxy.yaml
  - target: {kind: Application, name: regalia-postgres}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/base/apps/regalia/postgres/backup-values.yaml
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/regalia-postgres.yaml
  - target: {kind: Application, name: regalia-valkey}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/dev/values/regalia-valkey.yaml
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: ""
            kind: PersistentVolumeClaim
            jsonPointers:
              - /spec/volumeName
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: RespectIgnoreDifferences=true
