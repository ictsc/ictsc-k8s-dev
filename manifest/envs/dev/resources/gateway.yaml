# このファイルは `task render-env-values` が terraform output から生成する
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "27.133.146.104"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.k8s-dev.ictsc.net"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.k8s-dev.ictsc.net"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: external-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external
  namespace: gateway
  annotations:
    # Gateway と Certificate は相互依存するため同じ wave に置く。
    argocd.argoproj.io/sync-wave: "-15"
    # cert-manager の CRD は wave -20 で作られる。
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: external-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  # HTTP-01 はワイルドカード証明書に対応しない。
  dnsNames:
    - argocd.k8s-dev.ictsc.net
    - dex.k8s-dev.ictsc.net
    - httpbin.k8s-dev.ictsc.net
    - grafana.k8s-dev.ictsc.net
