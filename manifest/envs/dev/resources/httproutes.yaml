# このファイルは `task render-env-values` が terraform output から生成する
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - argocd.k8s-dev.ictsc.net
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - dex.k8s-dev.ictsc.net
  rules:
    - backendRefs:
        - name: dex
          port: 5556
---
# 認可 Service より後に作り、httpbin を ExternalAuth で保護する。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - httpbin.k8s-dev.ictsc.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              kind: Service
              name: oauth2-proxy
              namespace: oauth2-proxy
              port: 80
            http:
              allowedHeaders:
                - Cookie
                - X-Forwarded-Proto
                - X-Forwarded-Host
              allowedResponseHeaders:
                - Set-Cookie
                - X-Auth-Request-User
                - X-Auth-Request-Email
      backendRefs:
        - name: httpbin
          port: 8080
---
# Grafana はロール判定に groups を使うため Dex と直接 OIDC 接続する。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.k8s-dev.ictsc.net
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: httpbin-to-oauth2-proxy
  namespace: oauth2-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: httpbin
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: scoreserver-to-oauth2-proxy
  namespace: oauth2-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: scoreserver
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
---
