apiVersion: v1
kind: ServiceAccount
metadata:
  name: regalia-preview-appset-controller
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regalia-preview-appset-controller
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
rules:
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, applicationsets/finalizers]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [argoproj.io]
    resources: [applicationsets/status]
    verbs: [get, patch, update]
  - apiGroups: [argoproj.io]
    resources: [appprojects]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regalia-preview-appset-controller
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
subjects:
  - kind: ServiceAccount
    name: regalia-preview-appset-controller
    namespace: regalia-preview-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regalia-preview-appset-controller
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regalia-pr-preview-github-app
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: regalia-preview-github-app-only
  target:
    name: regalia-pr-preview-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: githubAppID
      remoteRef: {key: regalia-preview-github-app-id}
    - secretKey: githubAppInstallationID
      remoteRef: {key: regalia-preview-github-app-installation-id}
    - secretKey: githubAppPrivateKey
      remoteRef: {key: regalia-preview-github-app-private-key}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regalia-preview-appset-controller
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "-26"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: regalia-preview-appset-controller}
  template:
    metadata:
      labels: {app: regalia-preview-appset-controller}
    spec:
      serviceAccountName: regalia-preview-appset-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: quay.io/argoproj/argocd:v3.5.0
          args:
            - /usr/local/bin/argocd-applicationset-controller
            - --metrics-addr=:8080
            - --probe-addr=:8081
            - --webhook-addr=:7000
            - --argocd-repo-server=argocd-repo-server.argocd.svc.cluster.local:8081
            - --enable-leader-election=false
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {cpu: 200m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
