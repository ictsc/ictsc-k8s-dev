apiVersion: v1
kind: Namespace
metadata:
  name: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-applications
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  hard:
    # Kubernetes quota admission serializes concurrent creates. Existing
    # Application objects keep their slot until PR removal deletes them.
    count/applications.argoproj.io: "3"
    count/applicationsets.argoproj.io: "1"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: regalia-pr-preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  sourceNamespaces:
    - regalia-preview-control
  sourceRepos:
    - git@github.com:ictsc/ictsc-k8s-dev.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: regalia-pr-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: regalia-pr-preview
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  sourceNamespaces:
    - regalia-preview-control
  sourceRepos:
    - git@github.com:ictsc/ictsc-k8s-dev.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: regalia-pr-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: regalia-pr-preview
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - pullRequest:
        github:
          owner: ictsc
          repo: ictsc-regalia
          labels: [preview]
          appSecretName: regalia-pr-preview-github-app
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'regalia-pr-{{.number}}'
      namespace: regalia-preview-control
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: regalia-pr-preview
      source:
        repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
        targetRevision: refs/heads/main
        path: manifest/base/apps/regalia/pr-preview
        helm:
          valuesObject:
            enableExposure: true
          parameters:
            - name: prNumber
              value: '{{.number}}'
              forceString: true
            - name: headSHA
              value: '{{.head_sha}}'
              forceString: true
            - name: proxyImage
              value: ghcr.io/ictsc/ictsc-k8s-dev/regalia-preview-proxy@sha256:c53d311abc475b3fe060110e7d515a0a16b6999903d3aa705c7374468815f345
              forceString: true
      destination:
        server: https://kubernetes.default.svc
        namespace: 'regalia-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Images are published by a separate workflow after the PR head is
        # visible to ApplicationSet (about 3-5 minutes). The preview-images
        # hook fails after 180s while an image is missing; retry that sync.
        # Argo CD retries the SAME operation, including the old headSHA
        # parameter (refresh only re-resolves the Git revision). If the head
        # moved and the old images will never exist, automated sync can start
        # the new head only after retries run out: 4 attempts x ~3m plus
        # 30s+1m+2m backoff keeps that under ~16 minutes.
        retry:
          limit: 3
          refresh: true
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
