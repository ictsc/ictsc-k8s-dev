apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: regalia-preview-github-app-only
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  conditions:
    - namespaces: [regalia-preview-control]
  provider:
    webhook:
      url: 'https://secure.sakura.ad.jp/cloud/zone/is1a/api/cloud/1.1/secretmanager/vaults/{{ .auth.vaultID }}/secrets/unveil'
      method: POST
      timeout: 10s
      headers:
        Content-Type: application/json
        Authorization: 'Basic {{ print .auth.token ":" .auth.secret | b64enc }}'
      # The v2.10 webhook evaluates body before any HTTP request. It sets
      # remoteRef.namespace from the actual namespace, not the CR's input.
      # PushSecret has no remoteRef.namespace and is rejected as well.
      body: >-
        {{- if ne .remoteRef.namespace "regalia-preview-control" -}}{{ fail "preview store namespace denied" }}{{- end -}}
        {{- if not (or
          (eq .remoteRef.key "regalia-preview-github-app-id")
          (eq .remoteRef.key "regalia-preview-github-app-installation-id")
          (eq .remoteRef.key "regalia-preview-github-app-private-key")) -}}{{ fail "preview store key denied" }}{{- end -}}
        {"Secret":{"Name":{{ .remoteRef.key | toJson }}}}
      result:
        jsonPath: $.Secret.Value
      secrets:
        - name: auth
          secretRef:
            name: sakura-secret-manager-credentials
            namespace: external-secrets
