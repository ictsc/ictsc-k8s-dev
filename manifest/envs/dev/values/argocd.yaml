# このファイルは `task render-env-values` が terraform output から生成する
global:
  domain: argocd.k8s-dev.ictsc.net

configs:
  cm:
    oidc.config: |
      name: Dex
      issuer: https://dex.k8s-dev.ictsc.net
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  params:
    # Gateway との TLS 終端後のリダイレクトループを防ぐ。
    server.insecure: true

server:
  service:
    type: ClusterIP
