# このファイルは `task render-env-values` が terraform output から生成する
global:
  domain: argocd.k8s-dev.ictsc.net

configs:
  cm:
    # clientSecret は argocd-oidc Secret から読む (Git には置かない)
    oidc.config: |
      name: Dex
      issuer: https://dex.k8s-dev.ictsc.net
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  params:
    # false だと Gateway からの平文リクエストに 307 を返し続けてループする
    server.insecure: true

server:
  service:
    # VIP は Gateway が持つ
    type: ClusterIP
