# dev はNFSを使わず、永続ログをさくらのObject Storageへ保存する。
defaults:
  extraEnvFrom:
    - secretRef:
        name: loki-object-storage

loki:
  storage:
    type: s3
    bucketNames:
      chunks: ictsc-void-k8s-dev-loki-chunks
      ruler: ictsc-void-k8s-dev-loki-ruler
      admin: ictsc-void-k8s-dev-loki-admin
    s3:
      endpoint: https://s3.isk01.sakurastorage.jp
      region: jp-north-1
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      signatureVersion: v4
      s3ForcePathStyle: true
      insecure: false
      disable_dualstack: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: s3

# WALとキャッシュはemptyDir。chunksとindexはObject Storageに永続化される。
singleBinary:
  persistence:
    enabled: false
