# NFS から Longhorn へ移行した dev の監視データを保持する。
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

grafana:
  persistence:
    storageClassName: longhorn
