tempo:
  retention: 168h
  metricsGenerator:
    enabled: true
    processor:
      local_blocks:
        flush_to_storage: true
    storage:
      path: /var/tempo/metrics
    traces_storage:
      path: /var/tempo/metrics-traces
  overrides:
    defaults:
      metrics_generator:
        processors: [local-blocks]
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

persistence:
  enabled: true
  storageClassName: longhorn-single-replica
  size: 10Gi

serviceMonitor:
  enabled: true
