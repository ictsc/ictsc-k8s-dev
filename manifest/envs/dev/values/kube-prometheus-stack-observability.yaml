prometheus:
  prometheusSpec:
    enableOTLPReceiver: true

grafana:
  # The persistent RWO volume cannot be attached to old and new pods together.
  deploymentStrategy:
    type: Recreate
  env:
    GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.34.0
  dashboardProviders:
    audience-main.yaml:
      apiVersion: 1
      providers:
        - name: Audience Main
          orgId: 1
          type: file
          options:
            path: /var/lib/grafana/dashboards/audience-main
  dashboardsConfigMaps:
    audience-main: audience-command-logs
  additionalDataSources:
    - name: Audience VictoriaLogs
      uid: audience-victorialogs
      orgId: 1
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://audience-victorialogs.ictsc-audience.svc.cluster.local:9428
      editable: false
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus
