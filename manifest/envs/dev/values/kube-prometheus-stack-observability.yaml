prometheus:
  prometheusSpec:
    enableOTLPReceiver: true

grafana:
  # The persistent RWO volume cannot be attached to old and new pods together.
  deploymentStrategy:
    type: Recreate
  grafana.ini:
    auth.generic_oauth:
      role_attribute_path: "'Viewer'"
      org_attribute_path: "contains(groups || `[]`, 'ictsc:ictsc2026') && ['ictsc2026'] || `null`"
      org_mapping: "ictsc2026:1:Admin ictsc2026:2:Viewer"
  env:
    GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.34.0
  dashboardProviders:
    audience.yaml:
      apiVersion: 1
      providers:
        - name: Audience
          orgId: 2
          type: file
          options:
            path: /var/lib/grafana/dashboards/audience
  dashboardsConfigMaps:
    audience: audience-command-logs
  additionalDataSources:
    # Audience organization is created through the Grafana server admin API.
    - name: Audience VictoriaLogs
      uid: audience-victorialogs
      orgId: 2
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://audience-victorialogs.ictsc-audience.svc.cluster.local:9428
      editable: false
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus
