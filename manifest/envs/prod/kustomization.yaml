resources:
  - ../../base
  - ./edge-application.yaml
  - ./resources/storageclass-nfs.yaml
  - ./resources/storageclass-longhorn-single-replica.yaml
  - ./resources/regalia-openapi-database.yaml
  - ./resources/longhorn.yaml
  - ./resources/longhorn-metrics-policy.yaml

patches:
  # prod exposes Regalia directly; no httpbin demo service.
  - patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: httpbin
        namespace: argocd
  - patch: |-
      $patch: delete
      apiVersion: argocd-image-updater.argoproj.io/v1alpha1
      kind: ImageUpdater
      metadata:
        name: regalia
        namespace: argocd
  - target: {kind: Application, name: cilium}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/cilium.yaml
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/kube-prometheus-stack.yaml
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/kube-prometheus-stack-storage.yaml
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: ""
            kind: PersistentVolumeClaim
            jsonPointers:
              - /spec/volumeName
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: RespectIgnoreDifferences=true
  - target: {kind: Application, name: argocd}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/argocd.yaml
  - target: {kind: Application, name: dex}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/dex.yaml
  - target: {kind: Application, name: oauth2-proxy}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/oauth2-proxy.yaml
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/oauth2-proxy-internal.yaml
  - target: {kind: Application, name: regalia}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: manifest/base/apps/regalia/workload/overlays/openapi-prod
  - target: {kind: Application, name: regalia-postgres}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/regalia-postgres.yaml
  - target: {kind: Application, name: regalia-valkey}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/manifest/envs/prod/values/regalia-valkey.yaml
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: ""
            kind: PersistentVolumeClaim
            jsonPointers: [/spec/volumeName]
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: RespectIgnoreDifferences=true
