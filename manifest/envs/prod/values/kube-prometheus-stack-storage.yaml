# NFS から Longhorn へ配置する prod の監視データを保持する。
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn

grafana:
  persistence:
    storageClassName: longhorn
  # Avoid generating a different admin password on each Argo CD render.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
