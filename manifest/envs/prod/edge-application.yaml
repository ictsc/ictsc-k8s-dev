apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
    targetRevision: main
    path: manifest/envs/prod/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
