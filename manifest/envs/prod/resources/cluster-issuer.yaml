# このファイルは `task render-env-values` が terraform output から生成する
#
# HTTP-01 を Gateway API の HTTPRoute で解く。cert-manager は Gateway を
# 書き換えず、チャレンジ中だけ一時的な HTTPRoute を生やす。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@k1h.dev
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: external
                namespace: gateway
                kind: Gateway
