apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-serving-cert-approver
  namespace: argocd
  annotations:
    # metrics-server (wave 0) は kubelet の serving 証明書が CA 署名済みである
    # 前提 (--kubelet-insecure-tls を付けていない) なので、先に承認側を上げる。
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Helm chart は提供されておらず、upstream の kustomize ディレクトリを直接参照する。
  # control plane が 3 台あるので leader election ありの ha を使う。
  source:
    repoURL: https://github.com/alex1989hu/kubelet-serving-cert-approver.git
    targetRevision: v0.11.0
    # deploy/ha ではなく standalone を使う。
    #
    # ha は 2 レプリカでリーダー選出するが、待機系はリーダーになるまで
    # :8080 を listen しない。liveness probe がそこを叩くため
    # "connection refused" で殺され続け、CrashLoopBackOff から抜けられない
    # (実測: 14時間で 283 回再起動)。リーダー側は正常に動くので機能自体は
    # 満たされるが、Argo CD が永久に Progressing のままになり、
    # 本当の異常が埋もれる。
    #
    # kubelet の serving 証明書の更新は頻繁ではないので、
    # 1 レプリカが数十秒落ちても実害はない。
    path: deploy/standalone
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-serving-cert-approver
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
