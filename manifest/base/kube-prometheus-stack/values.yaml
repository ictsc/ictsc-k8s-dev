# Prometheus / Alertmanager / Grafana と既定のアラートルール一式。
# 保存先は NFS の StorageClass。20GB しかないので保持量を絞ってある。

# kube-proxy は動かしていない (Cilium の kubeProxyReplacement)
kubeProxy:
  enabled: false

# controller-manager / scheduler は talos/patches/controlplane.yaml で
# bind-address: 0.0.0.0 にしてあるので scrape できる
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true

# etcd のメトリクスは 2381 (listen-metrics-urls)。既定の 2379 ではない
kubeEtcd:
  enabled: true
  service:
    port: 2381
    targetPort: 2381

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 8GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    # AlertmanagerConfig を namespace に関係なく拾う。
    # 既定 (OnNamespace) だと monitoring 名前空間のアラートにしか適用されない。
    alertmanagerConfigMatcherStrategy:
      type: None
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager: kube-prometheus-stack
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # 実際の通知先は AlertmanagerConfig (resources/alertmanager-discord.yaml)。
      # webhook URL は Secret 参照でないと git に置くことになるため、
      # operator が Secret を読める CRD 側で定義している。
      receiver: "null"
      routes:
        # 常時発火する死活確認用アラート
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
    receivers:
      - name: "null"

grafana:
  persistence:
    enabled: true
    size: 1Gi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
  # 公開は Cilium Gateway API + oauth2-proxy 側で行う
  ingress:
    enabled: false

prometheus-node-exporter:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
