apiVersion: v1
kind: Service
metadata:
  name: audience-victorialogs
spec:
  selector:
    app: audience-victorialogs
  ports:
    - name: http
      port: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: audience-victorialogs
spec:
  serviceName: audience-victorialogs
  selector:
    matchLabels:
      app: audience-victorialogs
  template:
    metadata:
      labels:
        app: audience-victorialogs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.54.0
          args:
            - -storageDataPath=/data
            - -retentionPeriod=7d
            - -retention.maxDiskSpaceUsagePercent=80
          ports:
            - {name: http, containerPort: 9428}
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn-single-replica
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audience-victorialogs
spec:
  podSelector:
    matchLabels:
      app: audience-victorialogs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ictsc-audience-collector
        - podSelector:
            matchLabels:
              app: audience-grafana
      ports:
        - {protocol: TCP, port: 9428}
