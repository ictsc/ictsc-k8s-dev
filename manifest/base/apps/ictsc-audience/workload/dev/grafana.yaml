apiVersion: v1
kind: ConfigMap
metadata:
  name: audience-grafana-datasources
data:
  victorialogs.yaml: |
    apiVersion: 1
    datasources:
      - name: Audience VictoriaLogs
        uid: audience-victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://audience-victorialogs:9428
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audience-grafana
spec:
  selector:
    matchLabels:
      app: audience-grafana
  template:
    metadata:
      labels:
        app: audience-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.0
          env:
            # Pod の loopback に限定し、Kubernetes の port-forward 権限でアクセスする。
            - {name: GF_SERVER_HTTP_ADDR, value: "127.0.0.1"}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_SYNC, value: "victoriametrics-logs-datasource@0.34.0"}
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: audience-grafana-datasources
