apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collector
  namespace: ictsc-audience
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /v1/logs
      backendRefs:
        - name: collector
          port: 4318
          group: ""
          kind: Service
          weight: 1
