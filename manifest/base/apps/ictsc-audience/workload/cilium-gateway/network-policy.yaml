apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: collector
  namespace: ictsc-audience
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ictsc-audience-collector
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
