apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - httproute.yaml
  - network-policy.yaml
patches:
  # 平文の HTTP で受ける（TLS は Gateway）。VyOS の syslog（6514）は使わないので出さない
  - target: {kind: Deployment, name: collector}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: audience-ghcr}]
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: --config=/etc/otelcol/gateway.yaml
  - target: {kind: Deployment, name: collector}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: collector
      spec:
        template:
          spec:
            containers:
              - name: otelcol
                ports:
                  - {containerPort: 6514, $patch: delete}
                volumeMounts:
                  - {mountPath: /etc/otelcol/certs, $patch: delete}
            volumes:
              - {name: tls, $patch: delete}
  # Gateway からだけ届けばよいので、クラスタ内の Service にする
  - target: {kind: Service, name: collector}
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: collector
      spec:
        type: ClusterIP
        externalTrafficPolicy: null
        ports:
          - {port: 6514, $patch: delete}
