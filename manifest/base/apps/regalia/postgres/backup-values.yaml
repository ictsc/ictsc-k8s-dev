# CNPG 1.30 uses the Barman CNPG-I plugin. Destination is environment-specific.
cluster:
  postgresql:
    parameters:
      archive_timeout: 300s
backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  provider: s3
  secret:
    create: false
    name: postgres-backup-s3
  retentionPolicy: 14d
  wal:
    compression: gzip
    # Sakura Object Storage does not use the AWS SSE request headers.
    encryption: ""
  data:
    compression: gzip
    encryption: ""
    jobs: 1
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  scheduledBackups:
    - name: postgres-daily
      # 03:00 JST; CNPG uses six-field UTC cron.
      schedule: "0 0 18 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
