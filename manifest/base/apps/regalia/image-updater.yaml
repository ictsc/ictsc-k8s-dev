# Deploys every regalia main build to dev. prod deletes this resource and is
# updated by the release PR from .github/workflows/regalia-prod-release.yml.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: regalia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: git
    gitConfig:
      repository: git@github.com:ictsc/ictsc-k8s-dev.git
      branch: main
      writeBackTarget: kustomization:/manifest/base/apps/regalia/workload/overlays/openapi-dev
  applicationRefs:
    - namePattern: regalia
      # Only main publishes sha-<full commit> tags, so the newest one is the
      # latest main build. migrations is pushed before backend.
      images:
        - alias: migrations
          imageName: ghcr.io/ictsc/ictsc-regalia/migrations
          commonUpdateSettings:
            updateStrategy: newest-build
            # Only the PreSync migrate Job uses this image and Argo CD deletes
            # it on success, so it never shows up in the app's live images.
            # Without forceUpdate Image Updater would skip it.
            forceUpdate: true
            allowTags: regexp:^sha-[0-9a-f]{40}$
          manifestTargets:
            kustomize:
              name: migrations
        - alias: backend
          imageName: ghcr.io/ictsc/ictsc-regalia/backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^sha-[0-9a-f]{40}$
          manifestTargets:
            kustomize:
              name: backend
        - alias: frontend
          imageName: ghcr.io/ictsc/ictsc-regalia/frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^sha-[0-9a-f]{40}$
          manifestTargets:
            kustomize:
              name: frontend
