- op: add
  path: /spec/rules/0
  value:
    matches:
      - path:
          type: PathPrefix
          value: /oauth2
    backendRefs:
      - group: ""
        kind: Service
        name: oauth2-proxy
        namespace: oauth2-proxy
        port: 80
        weight: 1
- op: add
  path: /spec/rules/1/filters/0
  value:
    type: ExternalAuth
    externalAuth:
      protocol: HTTP
      backendRef:
        group: ""
        kind: Service
        name: oauth2-proxy
        namespace: oauth2-proxy
        port: 80
      http:
        allowedHeaders:
          - Cookie
          - X-Forwarded-Proto
          - X-Forwarded-Host
        allowedResponseHeaders:
          - Set-Cookie
          - X-Auth-Request-User
          - X-Auth-Request-Email
- op: add
  path: /spec/rules/2/filters
  value:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          group: ""
          kind: Service
          name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
        http:
          allowedHeaders:
            - Cookie
            - X-Forwarded-Proto
            - X-Forwarded-Host
          allowedResponseHeaders:
            - Set-Cookie
            - X-Auth-Request-User
            - X-Auth-Request-Email
