resources:
  - ../../base

components:
  - ../../components/external-secrets

namespace: scoreserver

configMapGenerator:
  - name: scoreserver-backend-config
    behavior: merge
    files:
      - admin-auth-config.yaml
      - admin-auth-policy.csv

images:
  - name: backend
    newName: ghcr.io/ictsc/ictsc-regalia/backend
    newTag: sha-f19af1e
  - name: frontend
    newName: ghcr.io/ictsc/ictsc-regalia/frontend
    newTag: sha-f19af1e
  - name: toolbox
    newName: ghcr.io/ictsc/ictsc-regalia/toolbox
    newTag: sha-f19af1e

patches:
  - path: httproute-patch.yaml
  - path: workload-patch.yaml
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
    path: external-auth-patch.yaml
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: scoreserver-admin
    patch: |-
      - op: add
        path: /spec/rules/1/filters/0/externalAuth/http/allowedResponseHeaders/-
        value: Authorization
