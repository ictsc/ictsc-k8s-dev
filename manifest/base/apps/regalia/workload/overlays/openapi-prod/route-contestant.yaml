apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scoreserver-contestant
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - contest.k8s.ictsc.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: scoreserver-backend
          port: 8080
          group: ''
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scoreserver-frontend
          port: 8080
          group: ''
          kind: Service
          weight: 1
