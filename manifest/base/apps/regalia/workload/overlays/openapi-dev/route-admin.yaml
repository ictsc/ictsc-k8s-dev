apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scoreserver-admin
spec:
  parentRefs:
  - name: external
    namespace: gateway
    sectionName: https
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - admin-contest.k8s-dev.ictsc.net
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        scheme: https
        statusCode: 302
        path:
          type: ReplaceFullPath
          replaceFullPath: /admin/
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        scheme: https
        statusCode: 302
