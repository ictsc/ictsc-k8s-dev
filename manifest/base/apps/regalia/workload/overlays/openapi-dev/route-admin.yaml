apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scoreserver-admin
spec:
  parentRefs:
  - name: external
    namespace: gateway
    sectionName: https
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - admin-contest.k8s-dev.ictsc.net
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplaceFullPath
          replaceFullPath: /admin/
  - matches:
    - path:
        type: PathPrefix
        value: /submissions
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/submissions
  - matches:
    - path:
        type: PathPrefix
        value: /teams
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/teams
  - matches:
    - path:
        type: PathPrefix
        value: /contestants
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/contestants
  - matches:
    - path:
        type: PathPrefix
        value: /scores
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/scores
  - matches:
    - path:
        type: PathPrefix
        value: /deployments
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/deployments
  - matches:
    - path:
        type: PathPrefix
        value: /settings
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/settings
  - matches:
    - path:
        type: PathPrefix
        value: /content
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /admin/content
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: contest.k8s-dev.ictsc.net
        statusCode: 302
