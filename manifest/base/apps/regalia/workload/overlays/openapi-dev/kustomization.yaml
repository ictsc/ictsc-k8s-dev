resources:
- backend.yaml
- frontend.yaml
- route-contestant.yaml
- route-admin.yaml
- migrate.yaml
namespace: scoreserver
# Argo CD Image Updater rewrites these tags on every regalia main build
# (manifest/base/apps/regalia/image-updater.yaml). The three images come from
# the same commit.
images:
- name: backend
  newName: ghcr.io/ictsc/ictsc-regalia/backend
  newTag: sha-332a8634ed9152b2a11f7955648f9e862ec96d5e
- name: frontend
  newName: ghcr.io/ictsc/ictsc-regalia/frontend
  newTag: sha-332a8634ed9152b2a11f7955648f9e862ec96d5e
- name: migrations
  newName: ghcr.io/ictsc/ictsc-regalia/migrations
  newTag: sha-332a8634ed9152b2a11f7955648f9e862ec96d5e
configMapGenerator:
- name: scoreserver-discord-teams
  envs:
  - discord.env
