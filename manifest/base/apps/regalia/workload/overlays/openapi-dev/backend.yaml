apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreserver-backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreserver-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreserver-backend
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: scoreserver-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scoreserver
        image: backend
        imagePullPolicy: Always
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: password
        - name: ICTSC_API_ADDRESS
          value: :8080
        - name: ICTSC_DATABASE_URL
          value: postgresql://postgres-rw:5432/ictscore_openapi?sslmode=require
        - name: ICTSC_REDIS_URL
          value: redis://valkey-proxy:6379/2
        - name: ICTSC_DEV_FAKE_MODE
          value: 'true'
        - name: ICTSC_SECONDARY_QUALIFIER_MODE
          value: 'true'
        - name: ICTSC_GITHUB_REPOSITORY
          value: ictsc/ictsc2026-pr2-master
        - name: ICTSC_GITHUB_REPOSITORY_ID
          value: '1418858779'
        - name: ICTSC_GITHUB_REF
          value: refs/heads/main
        - name: ICTSC_GITHUB_WORKFLOW_REF
          value: ictsc/ictsc2026-pr2-master/.github/workflows/regalia-refresh.yaml@refs/heads/main
        - name: ICTSC_GITHUB_OIDC_AUDIENCE
          value: regalia-2026-pr2-dev
        - name: ICTSC_GITHUB_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: regalia-content-github
              key: token
        - name: ICTSC_SECURE_COOKIES
          value: 'true'
        - name: ICTSC_ALLOWED_ORIGINS
          value: https://contest.k8s-dev.ictsc.net,https://admin-contest.k8s-dev.ictsc.net
        - name: ICTSC_DISCORD_CONTESTANT_REDIRECT_URI
          value: https://contest.k8s-dev.ictsc.net/api/v1/auth/discord/callback
        - name: ICTSC_DISCORD_ADMIN_REDIRECT_URI
          value: https://contest.k8s-dev.ictsc.net/api/v1/admin/auth/discord/callback
        - name: ICTSC_DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: discord-oauth-client
              key: client-id
        - name: ICTSC_DISCORD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: discord-oauth-client
              key: client-secret
        # Traces go to Tempo and metrics to Prometheus through the in-cluster
        # collector (manifest/envs/dev/values/opentelemetry-collector.yaml).
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.monitoring.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '15000'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment.name=dev,k8s.namespace.name=scoreserver,k8s.pod.name=$(POD_NAME)
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: scoreserver-discord-teams
---
apiVersion: v1
kind: Service
metadata:
  name: scoreserver-backend
spec:
  selector:
    app.kubernetes.io/name: scoreserver-backend
  ports:
  - name: http
    port: 8080
    targetPort: http
