apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreserver-backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreserver-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreserver-backend
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: scoreserver-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scoreserver
        image: backend
        imagePullPolicy: Always
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: password
        - name: ICTSC_API_ADDRESS
          value: :8080
        - name: ICTSC_DATABASE_URL
          value: postgresql://postgres-rw:5432/ictscore_openapi?sslmode=require
        - name: ICTSC_REDIS_URL
          value: redis://valkey-proxy:6379/1
        - name: ICTSC_DEV_FAKE_MODE
          value: 'true'
        - name: ICTSC_SECURE_COOKIES
          value: 'true'
        - name: ICTSC_ALLOWED_ORIGINS
          value: https://contest.k8s-dev.ictsc.net,https://admin-contest.k8s-dev.ictsc.net
        - name: ICTSC_DISCORD_CONTESTANT_REDIRECT_URI
          value: https://contest.k8s-dev.ictsc.net/api/v1/contestant/auth/discord/callback
        - name: ICTSC_DISCORD_ADMIN_REDIRECT_URI
          value: https://admin-contest.k8s-dev.ictsc.net/api/v1/admin/auth/discord/callback
        - name: ICTSC_DISCORD_ADMIN_GUILD_ID
          value: preview
        - name: ICTSC_DISCORD_ADMIN_ROLE_IDS
          value: preview-admin
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: scoreserver-backend
spec:
  selector:
    app.kubernetes.io/name: scoreserver-backend
  ports:
  - name: http
    port: 8080
    targetPort: http
