apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreserver-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreserver-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreserver-frontend
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: scoreserver-frontend
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # runtime-config.jsだけを起動時に書き換え可能にする。
      initContainers:
      - name: init-runtime-config
        image: frontend
        command: [sh, -c, 'touch /runtime/runtime-config.js']
        volumeMounts:
        - name: runtime-config
          mountPath: /runtime
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: scoreserver
        image: frontend
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: runtime-config
          mountPath: /var/www/contestant/runtime-config.js
          subPath: runtime-config.js
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: API_UPSTREAM
          value: http://scoreserver-backend:8080
        - name: NGINX_RESOLVER
          value: 127.0.0.1
        - name: ICTSC_DEMO_MODE
          value: "true"
      volumes:
      - name: runtime-config
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-conf
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scoreserver-frontend
spec:
  selector:
    app.kubernetes.io/name: scoreserver-frontend
  ports:
  - name: http
    port: 8080
    targetPort: http
