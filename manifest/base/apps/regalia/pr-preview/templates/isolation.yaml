apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-budget
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.storage: 2Gi
    persistentvolumeclaims: "2"
    pods: "8"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: preview-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: ictscore_openapi
      owner: app
  storage:
    size: 1Gi
    storageClass: longhorn-single-replica
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-valkey
spec:
  replicas: 1
  selector:
    matchLabels: {app: preview-valkey}
  template:
    metadata:
      labels: {app: preview-valkey}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey:8.1.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: preview-valkey
spec:
  selector: {app: preview-valkey}
  ports:
    - port: 6379
