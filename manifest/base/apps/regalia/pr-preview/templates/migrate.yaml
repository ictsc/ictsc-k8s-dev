apiVersion: batch/v1
kind: Job
metadata:
  name: preview-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: preview-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: collect-pr-sql
          image: ghcr.io/ictsc/ictsc-regalia/migrations:pr-{{ .Values.prNumber }}-{{ .Values.headSHA }}
          command: [sh, -ec]
          args: ["cp /migrations/[0-9]*.sql /bundle/; cp /migrations/seed-dev.sql /bundle/"]
          volumeMounts:
            - {name: bundle, mountPath: /bundle}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              until pg_isready; do sleep 2; done
              psql -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS preview_schema_migrations (name text PRIMARY KEY, checksum text NOT NULL)'
              reset=0
              for file in /bundle/[0-9]*.sql; do
                [ -f "$file" ] || { echo 'no migrations' >&2; exit 1; }
                name=${file##*/}
                case "$name" in *[!a-zA-Z0-9_.-]*) echo 'bad migration name' >&2; exit 1;; esac
                checksum=$(sha256sum "$file" | cut -d' ' -f1)
                stored=$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT checksum FROM preview_schema_migrations WHERE name = '$name'")
                if [ -n "$stored" ] && [ "$stored" != "$checksum" ]; then reset=1; fi
              done
              names=$(psql -X -v ON_ERROR_STOP=1 -Atqc 'SELECT name FROM preview_schema_migrations')
              for name in $names; do
                [ -f "/bundle/$name" ] || reset=1
              done
              recorded=$(psql -X -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM preview_schema_migrations')
              existing=$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.teams') IS NOT NULL")
              if [ "$recorded" = 0 ] && [ "$existing" = t ]; then reset=1; fi
              if [ "$reset" = 1 ]; then
                psql -X -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public'
                psql -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE preview_schema_migrations (name text PRIMARY KEY, checksum text NOT NULL)'
              fi
              for file in /bundle/[0-9]*.sql; do
                [ -f "$file" ] || { echo 'no migrations' >&2; exit 1; }
                name=${file##*/}
                case "$name" in *[!a-zA-Z0-9_.-]*) echo 'bad migration name' >&2; exit 1;; esac
                checksum=$(sha256sum "$file" | cut -d' ' -f1)
                stored=$(psql -X -v ON_ERROR_STOP=1 -Atqc "SELECT checksum FROM preview_schema_migrations WHERE name = '$name'")
                if [ -n "$stored" ]; then continue; fi
                psql -X -v ON_ERROR_STOP=1 -f "$file"
                psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO preview_schema_migrations(name, checksum) VALUES ('$name', '$checksum')"
              done
              seeded=$(psql -X -v ON_ERROR_STOP=1 -Atqc 'SELECT EXISTS (SELECT FROM teams)')
              case "$seeded" in
                t) ;;
                f) psql -X -v ON_ERROR_STOP=1 -f /bundle/seed-dev.sql ;;
                *) echo 'seed check failed' >&2; exit 1;;
              esac
          env:
            - {name: PGHOST, value: preview-db-rw}
            - {name: PGDATABASE, value: ictscore_openapi}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: preview-db-app, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: preview-db-app, key: password}
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: bundle, emptyDir: {}}
