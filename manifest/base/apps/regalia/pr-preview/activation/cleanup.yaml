# Delete only obsolete Applications owned by the permanent control AppSet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regalia-preview-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regalia-preview-cleanup
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "22"
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list, delete]
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    resourceNames: [regalia-pr-preview]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regalia-preview-cleanup
  namespace: regalia-preview-control
  annotations:
    argocd.argoproj.io/sync-wave: "22"
subjects:
  - kind: ServiceAccount
    name: regalia-preview-cleanup
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: regalia-preview-cleanup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: regalia-preview-cleanup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: regalia-preview-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: ghcr.io/ictsc/ictsc-k8s-dev/regalia-preview-cleanup@sha256:af5e5d4eb48ecbab2b2232d3a710dc811129ae4f3273251db5bc1fd02db558f8
              imagePullPolicy: IfNotPresent
              env:
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: regalia-pr-preview-github-app
                      key: githubAppID
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: regalia-pr-preview-github-app
                      key: githubAppInstallationID
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: regalia-pr-preview-github-app
                      key: githubAppPrivateKey
              resources:
                requests: {cpu: 10m, memory: 48Mi}
                limits: {cpu: 100m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
