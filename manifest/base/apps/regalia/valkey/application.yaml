apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regalia-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: regalia
  sources:
    - repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      targetRevision: 0.11.0
      helm:
        releaseName: valkey
        valueFiles:
          - $values/manifest/base/apps/regalia/valkey/values.yaml
    - repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: scoreserver
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
