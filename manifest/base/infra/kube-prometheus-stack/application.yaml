apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # CRD (ServiceMonitor / PrometheusRule) を他が参照しうるので早めに入れる。
    # ただし cert-manager (-20) より後でよい。
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.1
      helm:
        releaseName: kube-prometheus-stack
        # CRD が大きく、既定の kubectl apply では annotation のサイズ上限に当たる
        skipCrds: false
        valueFiles:
          - $values/manifest/base/infra/kube-prometheus-stack/values.yaml
    - repoURL: git@github.com:ictsc/ictsc-k8s-dev.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # node-exporter は hostPath / hostNetwork / hostPID を使う。
    # このクラスタの PodSecurity は既定が baseline (例外は kube-system のみ) なので、
    # ラベルを付けておかないと DaemonSet の Pod が admission で全部弾かれる。
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
