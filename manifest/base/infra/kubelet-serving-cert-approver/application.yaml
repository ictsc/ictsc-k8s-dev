apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-serving-cert-approver
  namespace: argocd
  annotations:
    # metrics-server (wave 0) は kubelet の serving 証明書が CA 署名済みである
    # 前提 (--kubelet-insecure-tls を付けていない) なので、先に承認側を上げる。
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alex1989hu/kubelet-serving-cert-approver.git
    targetRevision: v0.11.0
    # standaloneはleader election用RBACがないため、haを1 replicaで使う。
    path: deploy/ha
    kustomize:
      replicas:
        - name: kubelet-serving-cert-approver
          count: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-serving-cert-approver
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
