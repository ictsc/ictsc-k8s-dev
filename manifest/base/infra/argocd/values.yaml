global:
  domain: argocd.example.invalid # envs/<env>/values/argocd.yaml で上書きする

configs:
  cm:
    kustomize.buildOptions: --enable-helm
    timeout.reconciliation: 60s
  rbac:
    # Dex 経由で GitHub の team が groups として渡ってくる
    policy.csv: |
      g, ictsc:ictsc2026, role:admin
    policy.default: ''

controller:
  replicas: 1

repoServer:
  replicas: 2

server:
  replicas: 2
  # Service の type / IP は envs/<env>/values/argocd.yaml で指定する

applicationSet:
  replicas: 1

# 認証は外部の Dex (manifest/base/infra/dex) に寄せるので内蔵 Dex は使わない
dex:
  enabled: false

notifications:
  enabled: false
