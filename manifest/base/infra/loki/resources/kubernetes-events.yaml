groups:
  - name: kubernetes-events
    interval: 1m
    rules:
      - alert: KubernetesWarningEvent
        expr: |
          sum by (namespace, reason, kind, name) (
            count_over_time(
              {log_type="kubernetes_event"}
                | logfmt
                | type="Warning"
                | reason!="OperationCompleted"
              [10m]
            )
          ) >= 3
        for: 2m
        labels:
          severity: warning
          category: kubernetes-event
        annotations:
          summary: Kubernetes Warning Eventが繰り返し発生しています
          description: 直近10分に同一対象のWarning Eventが3回以上発生しています。namespace、reason、kind、nameラベルを確認してください。
